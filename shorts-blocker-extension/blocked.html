<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <p class="eyebrow">Shorts Blocker</p>
    <h1>Blocked: <span id="site">short-form video</span></h1>
    <p class="lede">This is a hard block. Close the tab or go back to the main feed.</p>

    <dl class="stats">
      <div><dt>Blocked today</dt><dd id="today">0</dd></div>
      <div><dt>All time</dt><dd id="total">0</dd></div>
    </dl>

    <div class="actions">
      <a id="home" class="button primary" hidden>Go to home</a>
      <button id="close" class="button" type="button">Close tab</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
